<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>AWS CLF-C02 • Mapa de Dominios y Progreso</title>

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #0b1120;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --orange: #f59e0b;
      --green: #10b981;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 50px; max-width: 560px; margin: 0 auto; line-height: 1.5; }

    /* Encabezado y Progreso Global */
    header { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .top-badge { display: inline-block; background: rgba(56, 189, 248, 0.15); color: var(--accent); font-size: 0.72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
    h1 { font-size: 1.35rem; color: #fff; margin-bottom: 4px; }
    .subtitle { font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; }

    .global-progress { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .gp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.88rem; font-weight: 700; }
    .gp-pct { color: var(--green); font-size: 1.05rem; }
    .bar-bg { width: 100%; height: 10px; background: #1e293b; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); width: 0%; transition: width 0.35s ease; }

    /* Tarjetas de Dominios (Árbol) */
    .domain-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 14px; overflow: hidden; transition: border-color 0.2s; }
    .domain-header { padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; user-select: none; }
    .domain-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .domain-title { font-size: 1.05rem; font-weight: 800; color: #fff; }
    .weight-pill { background: rgba(245, 158, 11, 0.16); color: var(--orange); border: 1px solid rgba(245, 158, 11, 0.4); font-size: 0.75rem; font-weight: 800; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
    
    .domain-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); }
    .mini-bar { flex: 1; height: 6px; background: var(--surface-alt); border-radius: 999px; margin: 0 10px; overflow: hidden; }
    .mini-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
    .mini-fill.done { background: var(--green); }

    /* Árbol de Temas (Ramas) */
    .tree-body { display: none; padding: 0 16px 16px 16px; border-top: 1px solid rgba(51, 65, 85, 0.6); background: rgba(11, 17, 32, 0.4); }
    .domain-card.open .tree-body { display: block; }
    .tree-list { list-style: none; position: relative; padding-left: 18px; margin-top: 12px; }
    .tree-list::before { content: ""; position: absolute; left: 6px; top: 4px; bottom: 14px; width: 2px; background: var(--border); }

    .tree-item { position: relative; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tree-item::before { content: ""; position: absolute; left: -12px; top: 50%; width: 12px; height: 2px; background: var(--border); }
    .tree-item.completed { border-color: rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.06); }

    .item-left { display: flex; align-items: flex-start; gap: 10px; flex: 1; cursor: pointer; }
    .chk-box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; font-size: 0.8rem; font-weight: bold; color: #0f172a; transition: 0.15s; }
    .tree-item.completed .chk-box { background: var(--green); border-color: var(--green); }

    .item-info strong { display: block; font-size: 0.92rem; color: #f8fafc; }
    .tree-item.completed .item-info strong { color: #a7f3d0; }
    .item-info span { display: block; font-size: 0.78rem; color: var(--muted); }

    /* Botón de enlace a página creada vs pendiente */
    .link-btn { background: var(--accent); color: #0f172a; text-decoration: none; font-size: 0.78rem; font-weight: 800; padding: 6px 11px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
    .link-btn:active { transform: scale(0.96); }
    .pending-tag { background: rgba(148, 163, 184, 0.12); color: var(--muted); border: 1px dashed var(--border); font-size: 0.72rem; font-weight: 600; padding: 5px 9px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }

    .footer-actions { text-align: center; margin-top: 20px; }
    .reset-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <span class="top-badge">Ruta de Certificación CLF-C02</span>
    <h1>🌳 Árbol de Dominios AWS</h1>
    <p class="subtitle">Toca cada tema para marcar tu avance o abrir tu guía de estudio</p>

    <div class="global-progress">
      <div class="gp-header">
        <span>Progreso Total del Examen</span>
        <span class="gp-pct" id="globalPct">0%</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="globalBar"></div></div>
      <div style="font-size: 0.75rem; color: var(--muted); margin-top: 6px; text-align: right;" id="globalCount">0 de 16 temas dominados</div>
    </div>
  </header>

  <main id="domainsTree"></main>

  <div class="footer-actions">
    <button class="reset-btn" onclick="resetProgress()">🔄 Reiniciar progreso guardado</button>
  </div>

  <script>
    // ESTRUCTURA DEL ÁRBOL DE DOMINIOS Y ARCHIVOS ENLAZADOS
    const CURRICULUM = [
      {
        id: "d1",
        titulo: "Dominio 1: Conceptos de la Nube",
        peso: "24%",
        abierto: true,
        temas: [
          {
            id: "d1_modelos",
            nombre: "Modelos de Nube (IaaS, PaaS, SaaS)",
            detalle: "Tipos de servicio y responsabilidad de gestión",
            archivo: "modelonube.html",
            labelBtn: "Estudiar ➔"
          },
          {
            id: "d1_caf",
            nombre: "AWS CAF y Estrategias 7 R",
            detalle: "6 perspectivas, fases de adopción y migración",
            archivo: "caf_r7.html",
            labelBtn: "Estudiar ➔"
          },
          {
            id: "d1_waf",
            nombre: "Well-Architected Framework",
            detalle: "Los 6 pilares de arquitectura y diseño en la nube",
            archivo: null
          },
          {
            id: "d1_economia",
            nombre: "Ventajas y Economía en la Nube",
            detalle: "CAPEX vs OPEX, economías de escala y agilidad",
            archivo: null
          }
        ]
      },
      {
        id: "d2",
        titulo: "Dominio 2: Seguridad y Conformidad",
        peso: "30%",
        abierto: true,
        temas: [
          {
            id: "d2_defensa",
            nombre: "Seguridad Perimetral y Detección",
            detalle: "WAF, Shield, GuardDuty, Inspector, Macie y Security Hub",
            archivo: "seguridad.html",
            labelBtn: "Estudiar ➔"
          },
          {
            id: "d2_compartida",
            nombre: "Modelo de Responsabilidad Compartida",
            detalle: "Seguridad DE la nube vs EN la nube",
            archivo: null
          },
          {
            id: "d2_iam",
            nombre: "Gestión de Identidades (IAM)",
            detalle: "Usuarios, grupos, roles, políticas, MFA y usuario raíz",
            archivo: null
          },
          {
            id: "d2_cifrado_auditoria",
            nombre: "Cifrado y Conformidad",
            detalle: "KMS, CloudTrail, Config y AWS Artifact",
            archivo: null
          }
        ]
      },
      {
        id: "d3",
        titulo: "Dominio 3: Tecnología y Servicios",
        peso: "34%",
        abierto: true,
        temas: [
          {
            id: "d3_escalabilidad",
            nombre: "Escalabilidad y Alta Disponibilidad",
            detalle: "Auto Scaling, ELB/ALB, Multi-AZ, RTO y RPO",
            archivo: "escalabilidad.html",
            labelBtn: "Simulador ➔"
          },
          {
            id: "d3_global",
            nombre: "Infraestructura Global AWS",
            detalle: "Regiones, Zonas de Disponibilidad (AZ) y Edge Locations",
            archivo: null
          },
          {
            id: "d3_computo",
            nombre: "Servicios de Cómputo",
            detalle: "EC2, AWS Lambda (Serverless), ECS y EKS",
            archivo: null
          },
          {
            id: "d3_almacenamiento",
            nombre: "Almacenamiento en la Nube",
            detalle: "S3 (clases y durabilidad), EBS, EFS y S3 Glacier",
            archivo: null
          },
          {
            id: "d3_bd_redes",
            nombre: "Bases de Datos y Redes",
            detalle: "RDS, DynamoDB, VPC, Subredes, Security Groups y Route 53",
            archivo: null
          }
        ]
      },
      {
        id: "d4",
        titulo: "Dominio 4: Facturación y Soporte",
        peso: "12%",
        abierto: false,
        temas: [
          {
            id: "d4_precios",
            nombre: "Modelos de Precios EC2",
            detalle: "On-Demand, Reserved Instances, Spot y Savings Plans",
            archivo: null
          },
          {
            id: "d4_costos",
            nombre: "Gestión y Control de Costos",
            detalle: "AWS Organizations, Cost Explorer, Budgets y Pricing Calculator",
            archivo: null
          },
          {
            id: "d4_soporte",
            nombre: "Planes de Soporte y Recursos",
            detalle: "Basic, Developer, Business, Enterprise y Trusted Advisor",
            archivo: null
          }
        ]
      }
    ];

    // Estado guardado en el celular/navegador (localStorage)
    let completedSet = new Set(JSON.parse(localStorage.getItem('aws_clf_progress') || '[]'));

    function saveProgress() {
      localStorage.setItem('aws_clf_progress', JSON.stringify([...completedSet]));
      renderTree();
    }

    function toggleTema(temaId) {
      if (completedSet.has(temaId)) {
        completedSet.delete(temaId);
      } else {
        completedSet.add(temaId);
      }
      saveProgress();
    }

    function toggleDomain(idx) {
      CURRICULUM[idx].abierto = !CURRICULUM[idx].abierto;
      renderTree();
    }

    function resetProgress() {
      if (confirm("¿Deseas reiniciar todas las casillas de progreso?")) {
        completedSet.clear();
        saveProgress();
      }
    }

    function renderTree() {
      const container = document.getElementById('domainsTree');
      container.innerHTML = '';

      let totalTemas = 0;
      let totalCompletados = 0;

      CURRICULUM.forEach((dom, dIdx) => {
        const domTotal = dom.temas.length;
        const domDone = dom.temas.filter(t => completedSet.has(t.id)).length;
        const domPct = Math.round((domDone / domTotal) * 100);

        totalTemas += domTotal;
        totalCompletados += domDone;

        let temasHTML = '';
        dom.temas.forEach(t => {
          const isDone = completedSet.has(t.id);
          const actionHTML = t.archivo
            ? `<a href="${t.archivo}" class="link-btn">${t.labelBtn || 'Abrir ➔'}</a>`
            : `<span class="pending-tag">Por crear</span>`;

          temasHTML += `
            <li class="tree-item ${isDone ? 'completed' : ''}">
              <div class="item-left" onclick="toggleTema('${t.id}')">
                <div class="chk-box">${isDone ? '✓' : ''}</div>
                <div class="item-info">
                  <strong>${t.nombre}</strong>
                  <span>${t.detalle}</span>
                </div>
              </div>
              ${actionHTML}
            </li>
          `;
        });

        const card = document.createElement('div');
        card.className = `domain-card ${dom.abierto ? 'open' : ''}`;
        card.innerHTML = `
          <div class="domain-header" onclick="toggleDomain(${dIdx})">
            <div class="domain-top">
              <div class="domain-title">${dom.abierto ? '▼' : '▶'} ${dom.titulo}</div>
              <span class="weight-pill">Peso: ${dom.peso}</span>
            </div>
            <div class="domain-meta">
              <span>${domDone}/${domTotal} temas</span>
              <div class="mini-bar"><div class="mini-fill ${domPct === 100 ? 'done' : ''}" style="width:${domPct}%"></div></div>
              <span>${domPct}%</span>
            </div>
          </div>
          <div class="tree-body">
            <ul class="tree-list">
              ${temasHTML}
            </ul>
          </div>
        `;
        container.appendChild(card);
      });

      const globalPct = Math.round((totalCompletados / totalTemas) * 100);
      document.getElementById('globalPct').textContent = `${globalPct}%`;
      document.getElementById('globalBar').style.width = `${globalPct}%`;
      document.getElementById('globalCount').textContent = `${totalCompletados} de ${totalTemas} temas dominados`;
    }

    renderTree();
  </script>
</body>
</html>
